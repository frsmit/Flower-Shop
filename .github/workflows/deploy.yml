name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you redeploy by hand from the Actions tab without pushing anything.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# If you push twice quickly, let the newer run win.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Ten for ten. The audio and the manifest are committed (see .gitignore),
      # so CI has them and this is only a guard - but a load-bearing one.
      #
      # useSongs cannot tell a 404 from "no music configured", because the
      # second is a real state that every clone is in. So a manifest naming a
      # file that isn't here does not fail the build: it deploys green and the
      # music tab silently never appears. This turns that into a red build.
      - run: npm run songs:check

      # The photographs live in Google Drive; only their links travel, one per
      # line in this secret (see scripts/write-photos.mjs). It writes
      # public/photos/photos.json for the build and fails the run if any link
      # doesn't load as an image - an unshared photo would otherwise deploy
      # green and simply be missing. Unset builds without photographs.
      - run: npm run photos:write
        env:
          BIRTHDAY_PHOTOS: ${{ secrets.BIRTHDAY_PHOTOS }}

      # Set these under Settings -> Secrets and variables -> Actions.
      # Anything missing falls back to the neutral defaults in src/config.js.
      #
      # These are BUILD-TIME values: Vite inlines them into the bundle, so they
      # keep the personal details out of the repo but are readable by anyone who
      # opens the page. Secrets here are about the repo, not the visitor.
      - run: npm run build
        env:
          VITE_BIRTHDAY_NAME: ${{ secrets.VITE_BIRTHDAY_NAME }}
          VITE_BIRTHDAY_DATE: ${{ secrets.VITE_BIRTHDAY_DATE }}
          VITE_CELEBRATION_HOURS: ${{ secrets.VITE_CELEBRATION_HOURS }}
          VITE_SECRET_HASH: ${{ secrets.VITE_SECRET_HASH }}
          VITE_SECRET_HINT: ${{ secrets.VITE_SECRET_HINT }}
          # Without this the build silently falls back to the impersonal
          # placeholder poem in src/lib/poem.js - which looks like it worked.
          VITE_POEM: ${{ secrets.VITE_POEM }}
          VITE_LETTER_OPENING: ${{ secrets.VITE_LETTER_OPENING }}
          VITE_LETTER_BODY: ${{ secrets.VITE_LETTER_BODY }}
          VITE_LETTER_SIGNOFF: ${{ secrets.VITE_LETTER_SIGNOFF }}
          VITE_BIRTHDAY_MESSAGE: ${{ secrets.VITE_BIRTHDAY_MESSAGE }}
          VITE_BIRTHDAY_TITLE: ${{ secrets.VITE_BIRTHDAY_TITLE }}
          VITE_BIRTHDAY_WISH: ${{ secrets.VITE_BIRTHDAY_WISH }}
          # Same trap as VITE_POEM. Unset isn't an error here - it is a valid
          # choice, and it reads as "no age configured", so the deployed build
          # would skip the whole age-burn opening and look like it worked. It
          # runs once, unattended, at midnight; there is no second attempt.
          VITE_BIRTHDAY_AGE: ${{ secrets.VITE_BIRTHDAY_AGE }}

      - uses: actions/configure-pages@v5

      # `base: './'` in vite.config.js is what makes this work from the
      # /<repo>/ subpath Pages serves from.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
